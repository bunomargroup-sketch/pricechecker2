function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))} function toast(m){$('toast').innerHTML='<span>'+esc(m)+'</span>';setTimeout(()=>$('toast').innerHTML='',2500)} function imgUrl(path){return IMAGE_BASE+String(path||'').split('/').map(encodeURIComponent).join('/')} function firstImg(p){return (p.image_paths&&p.image_paths[0])||p.image||p.code+'.jpg'} function hasPhotos(p){return Array.isArray(p.image_paths)&&p.image_paths.length>0}
async function sb(path,opt={}){const res=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+authBearer(),'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}}); if(!res.ok)throw new Error(await res.text()); return res.status===204?null:res.json()}

async function ensureAdminShopAuth(){
  try{
    if(authSession?.access_token){const rows=await sb('staff_roles?select=role&user_id=eq.'+authSession.user.id); if(rows&&rows[0]?.role==='admin')return true;}
    const identifier=prompt('المعرّف'); if(!identifier)return false;
    const code=prompt('الكود'); if(!code)return false;
    const user=await authSignIn(identifier,code);
    const rows=await sb('staff_roles?select=role&user_id=eq.'+user.id);
    if(rows&&rows[0]?.role==='admin')return true;
  }catch(e){console.error(e)}
  document.body.innerHTML='<div style="direction:rtl;font-family:Cairo,Tahoma;padding:40px;text-align:center"><h2>غير مصرح</h2><p>هذه الصفحة للمدير فقط.</p></div>';
  return false;
}

async function loadDetails(){try{const rows=await sb('web_products?select=*&order=sort_order.asc',{method:'GET'}); const map=new Map((rows||[]).map(r=>[r.code,normalizeRow(r)])); const merged=BASE_PRODUCTS.map(p=>map.get(p.code)||normalizeRow({...p,featured:p.featured==='yes'})); (rows||[]).forEach(r=>{if(!merged.some(p=>p.code===r.code))merged.push(normalizeRow(r))}); PRODUCTS=merged; populateFilters(); render();}catch(e){console.warn(e); populateFilters(); render();}}

async function syncAll(){if(!confirm('سيتم رفع/تحديث كل المنتجات المختارة في Supabase. متابعة؟'))return; $('syncProgress').style.display='block'; const existing=await sb('web_products?select=*',{method:'GET'}).catch(()=>[]); const map=new Map((existing||[]).map(r=>[r.code,normalizeRow(r)])); const rows=BASE_PRODUCTS.map((p,i)=>{const old=map.get(p.code)||{}; return payload({...normalizeRow(p),description:old.description||p.description||'',image_paths:old.image_paths||[],active:old.active!==false,featured:old.featured===true||p.featured==='yes',sort_order:p.sort_order||i+1})}); for(let i=0;i<rows.length;i+=100){await sb('web_products',{method:'POST',body:JSON.stringify(rows.slice(i,i+100)),headers:{Prefer:'resolution=merge-duplicates'}}); $('syncBar').style.width=Math.round((i+100)/rows.length*100)+'%'} toast('تمت مزامنة المنتجات'); $('syncBar').style.width='100%'; await loadDetails();}
function populateFilters(){const cats=['all',...Array.from(new Set(PRODUCTS.map(p=>p.main_category).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ar'))]; $('filterMain').innerHTML=cats.map(c=>`<option value="${esc(c)}">${c==='all'?'الكل':esc(c)}</option>`).join('')}
function filtered(){const q=$('search').value.toLowerCase().trim(), cat=$('filterMain').value, st=$('filterStatus').value; let list=PRODUCTS.filter(p=>(cat==='all'||p.main_category===cat)&&(!q||[p.code,p.name,p.brand,p.model,p.category,p.main_category].join(' ').toLowerCase().includes(q))); if(st==='active')list=list.filter(p=>p.active!==false); if(st==='hidden')list=list.filter(p=>p.active===false); if(st==='photos')list=list.filter(hasPhotos); if(st==='noPhotos')list=list.filter(p=>!hasPhotos(p)); if(st==='featured')list=list.filter(p=>p.featured); const sort=$('sortBy').value; if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ar')); if(sort==='priceDesc')list.sort((a,b)=>b.price-a.price); if(sort==='priceAsc')list.sort((a,b)=>a.price-b.price); if(sort==='sort')list.sort((a,b)=>(a.sort_order||9999)-(b.sort_order||9999)); return list}
function render(){const list=filtered(); $('grid').innerHTML=list.map(p=>`<div class="p"><div class="img"><img src="${imgUrl(firstImg(p))}" onerror="this.remove();this.parentElement.textContent='لا توجد صورة'"></div><div class="body"><div class="code">${esc(p.code)}</div><div class="name">${esc(p.name)}</div><div class="meta">${esc([p.main_category,p.category,p.brand,p.model].filter(Boolean).join(' / '))}</div><div class="price">${p.price} د.ل</div><div class="badges"><span class="badge ${p.active?'ok':''}">${p.active?'ظاهر':'مخفي'}</span>${hasPhotos(p)?'<span class="badge ok">صور</span>':'<span class="badge">بدون صور</span>'}${p.featured?'<span class="badge warn">مميز</span>':''}</div><div class="actions"><button class="btn blue small" data-edit="${esc(p.code)}">إدارة</button><button class="btn small ${p.active?'red':'green'}" data-toggle="${esc(p.code)}">${p.active?'إخفاء':'إظهار'}</button></div></div></div>`).join('')||'<div class="card">لا توجد نتائج</div>'; updateStats(list)}
function updateStats(list=PRODUCTS){$('statTotal').textContent=PRODUCTS.length; $('statActive').textContent=PRODUCTS.filter(p=>p.active).length; $('statPhotos').textContent=PRODUCTS.filter(hasPhotos).length; $('statFeatured').textContent=PRODUCTS.filter(p=>p.featured).length}
function openNewProduct(){const nextSort=(Math.max(0,...PRODUCTS.map(p=>Number(p.sort_order)||0))+1); current={code:'',name:'',brand:'',model:'',main_category:'',category:'',price:0,cost:0,description:'',image_paths:[],active:true,featured:false,sort_order:nextSort}; $('mTitle').textContent='إضافة منتج جديد'; $('mCode').readOnly=false; $('mCode').value=''; $('mName').value=''; $('mBrand').value=''; $('mModel').value=''; $('mMainCat').value=''; $('mCategory').value=''; $('mPrice').value=0; if($('mCost'))$('mCost').value=0; $('mSort').value=nextSort; $('mFeatured').value='false'; $('mActive').value='true'; $('mDesc').value=''; renderPhotos(); $('modal').classList.add('show'); setTimeout(()=>$('mCode').focus(),50)}
function openEdit(code){current=PRODUCTS.find(p=>p.code===code); if(!current)return; $('mTitle').textContent=current.code+' — '+current.name; $('mCode').readOnly=true; $('mCode').value=current.code; $('mName').value=current.name; $('mBrand').value=current.brand; $('mModel').value=current.model; $('mMainCat').value=current.main_category; $('mCategory').value=current.category; $('mPrice').value=current.price; if($('mCost'))$('mCost').value=current.cost||0; $('mSort').value=current.sort_order||0; $('mFeatured').value=current.featured?'true':'false'; $('mActive').value=current.active!==false?'true':'false'; $('mDesc').value=current.description||''; renderPhotos(); $('modal').classList.add('show')}
function renderPhotos(){const arr=current?.image_paths||[]; $('photos').innerHTML=arr.map(path=>`<div class="photo"><img src="${imgUrl(path)}"><button class="del" data-del-photo="${esc(path)}">×</button></div>`).join('')||'<div class="meta">لا توجد صور مرفوعة</div>'}
async function saveProduct(){if(!current)return; const isNew=!current.code; const code=$('mCode').value.trim(); if(!code)return toast('اكتب كود المنتج'); if(!$('mName').value.trim())return toast('اكتب اسم المنتج'); if(isNew&&PRODUCTS.some(p=>String(p.code).toLowerCase()===code.toLowerCase()))return toast('هذا الكود موجود مسبقًا'); Object.assign(current,{code,name:$('mName').value.trim(),brand:$('mBrand').value.trim(),model:$('mModel').value.trim(),main_category:$('mMainCat').value.trim(),category:$('mCategory').value.trim(),price:Number($('mPrice').value)||0,cost:Number($('mCost')?.value)||0,sort_order:Number($('mSort').value)||0,featured:$('mFeatured').value==='true',active:$('mActive').value==='true',description:$('mDesc').value.trim(),image_paths:current.image_paths||[]}); await sb('web_products',{method:'POST',body:JSON.stringify(payload(current)),headers:{Prefer:'resolution=merge-duplicates'}}); toast(isNew?'تم إضافة المنتج':'تم حفظ المنتج'); await loadDetails(); if(isNew)openEdit(code);}
async function uploadFiles(){if(!current)return; const files=[...$('files').files]; if(!files.length)return toast('اختر صورة'); current.image_paths=current.image_paths||[]; for(const [i,file] of files.entries()){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(); const path=current.code+'/'+Date.now()+'-'+i+'.'+(ext==='png'?'png':'jpg'); const res=await fetch(SUPABASE_URL+'/storage/v1/object/product-images/'+path.split('/').map(encodeURIComponent).join('/'),{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+authBearer(),'Content-Type':file.type||'image/jpeg','x-upsert':'true'},body:file}); if(res.ok)current.image_paths.push(path); else console.error(await res.text())} $('files').value=''; await saveProduct(); renderPhotos(); toast('تم رفع الصور')}
async function toggleActive(code){const p=PRODUCTS.find(x=>x.code===code); if(!p)return; p.active=!p.active; await sb('web_products',{method:'POST',body:JSON.stringify(payload(p)),headers:{Prefer:'resolution=merge-duplicates'}}); render(); toast(p.active?'تم الإظهار':'تم الإخفاء')}
document.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'); if(edit)openEdit(edit.dataset.edit); const tog=e.target.closest('[data-toggle]'); if(tog)toggleActive(tog.dataset.toggle); const del=e.target.closest('[data-del-photo]'); if(del&&current){current.image_paths=(current.image_paths||[]).filter(x=>x!==del.dataset.delPhoto); renderPhotos(); saveProduct()}}); ['search','filterMain','filterStatus','sortBy'].forEach(id=>$(id).addEventListener('input',render)); $('close').onclick=()=>$('modal').classList.remove('show'); $('save').onclick=saveProduct; $('upload').onclick=uploadFiles; $('newProduct').onclick=openNewProduct; $('syncAll').onclick=syncAll; $('reload').onclick=loadDetails; ensureAdminShopAuth().then(ok=>{if(ok)loadDetails();});
