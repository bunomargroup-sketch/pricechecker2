<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>مجموعة بن عمر — قارئ الأسعار</title>
  <meta name="theme-color" content="#0b2c8f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="بن عمر" />
  <style>
    :root {
      --blue: #082b9e;
      --blue-2: #1248d6;
      --bg: #f4f7ff;
      --card: #ffffff;
      --text: #111827;
      --muted: #667085;
      --border: #dbe4ff;
      --success: #069669;
      --danger: #dc2626;
      --warning: #b7791f;
      --shadow: 0 18px 45px rgba(8, 43, 158, .13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(18, 72, 214, .16), transparent 36rem),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--border);
    }

    .brand-title {
      color: var(--blue);
      font-weight: 900;
      font-size: 18px;
      line-height: 1.25;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .count-badge {
      border: 1px solid var(--border);
      color: var(--blue);
      background: #f8faff;
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    main {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 14px 34px;
      flex: 1;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
      background: #eaf0ff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 6px;
    }

    .tab-btn {
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: var(--muted);
      padding: 12px 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .tab-btn.active {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--blue-2));
      box-shadow: 0 8px 18px rgba(8, 43, 158, .22);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .input-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 16px;
      padding: 15px 16px;
      color: var(--text);
      font-size: 18px;
      outline: none;
      font-family: inherit;
      transition: .2s;
    }

    input[dir="ltr"] { text-align: left; font-family: Consolas, Monaco, monospace; }

    input:focus {
      border-color: var(--blue-2);
      box-shadow: 0 0 0 5px rgba(18, 72, 214, .12);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: .2s;
    }

    .btn:active { transform: scale(.99); }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--blue-2));
    }

    .btn-success {
      color: #fff;
      background: linear-gradient(135deg, #078f67, #10b981);
    }

    .btn-danger {
      color: #fff;
      background: linear-gradient(135deg, #dc2626, #ef4444);
    }

    .btn-light {
      color: var(--blue);
      background: #eef3ff;
      border: 1px solid var(--border);
    }

    .row-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .camera-box {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 14px;
      aspect-ratio: 4 / 3;
      border-radius: 22px;
      overflow: hidden;
      background: #0f172a;
      position: relative;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    #reader { width: 100%; height: 100%; display: none; }
    #video { width: 100%; height: 100%; object-fit: cover; display: none; }

    .camera-placeholder {
      text-align: center;
      color: rgba(255,255,255,.82);
      padding: 18px;
      line-height: 1.8;
    }

    .scan-line {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 3px;
      background: #22c55e;
      box-shadow: 0 0 18px #22c55e;
      display: none;
      animation: scanMove 1.8s ease-in-out infinite;
      z-index: 2;
    }

    @keyframes scanMove {
      0%, 100% { top: 22%; opacity: .25; }
      50% { top: 78%; opacity: 1; }
    }

    .result { margin-top: 14px; }

    .product-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: var(--shadow);
      animation: pop .22s ease-out;
    }

    @keyframes pop {
      from { transform: translateY(8px); opacity: .4; }
      to { transform: translateY(0); opacity: 1; }
    }

    .product-head {
      background: linear-gradient(135deg, var(--blue), var(--blue-2));
      color: #fff;
      padding: 18px;
      text-align: center;
    }

    .product-code {
      direction: ltr;
      font-family: Consolas, Monaco, monospace;
      font-weight: 900;
      font-size: 25px;
      letter-spacing: 1px;
      word-break: break-word;
    }

    .product-body { padding: 18px; }

    .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .product-name {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .price-box {
      border-radius: 22px;
      padding: 18px;
      background: linear-gradient(135deg, rgba(16, 185, 129, .12), rgba(16, 185, 129, .04));
      border: 1px solid rgba(16, 185, 129, .25);
      text-align: center;
    }

    .price {
      color: var(--success);
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
    }

    .currency {
      color: var(--success);
      font-size: 16px;
      font-weight: 900;
      margin-top: 6px;
    }

    .not-found {
      border: 1px solid rgba(220, 38, 38, .2);
      background: #fff8f8;
      color: var(--danger);
      border-radius: 22px;
      padding: 22px;
      text-align: center;
      font-weight: 900;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin-top: 10px;
      text-align: center;
    }

    .list-card {
      padding: 0;
      overflow: hidden;
    }

    .search-list-head {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      background: #fbfcff;
    }

    .products-list {
      max-height: calc(100vh - 260px);
      overflow: auto;
    }

    .product-item {
      padding: 13px 14px;
      border-bottom: 1px solid #edf1ff;
      display: grid;
      grid-template-columns: 92px 1fr auto;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      background: #fff;
    }

    .product-item:hover { background: #f8faff; }

    .item-code {
      direction: ltr;
      text-align: left;
      font-family: Consolas, Monaco, monospace;
      color: var(--blue);
      font-weight: 900;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-name {
      color: #344054;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-price {
      color: var(--success);
      font-weight: 900;
      white-space: nowrap;
      font-size: 14px;
    }

    .footer-note {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      padding: 12px;
      background: #fbfcff;
    }

    .toast-wrap {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      max-width: 620px;
      margin: 0 auto;
      width: fit-content;
      min-width: min(440px, 100%);
      background: #111827;
      color: #fff;
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 18px 38px rgba(0,0,0,.24);
      text-align: center;
      font-weight: 800;
      animation: toastIn .25s ease-out;
    }

    .toast.success { background: #047857; }
    .toast.error { background: #b91c1c; }
    .toast.info { background: #1d4ed8; }

    @keyframes toastIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .small-muted { color: var(--muted); font-size: 12px; }

    @media (max-width: 560px) {
      .header-inner { padding: 10px 12px; }
      .brand img { width: 46px; height: 46px; }
      .brand-title { font-size: 16px; }
      .brand-subtitle { font-size: 11px; }
      .count-badge { font-size: 11px; padding: 7px 9px; }
      main { padding: 12px 10px 28px; }
      .card { padding: 14px; border-radius: 20px; }
      .tabs { gap: 5px; padding: 5px; border-radius: 16px; }
      .tab-btn { font-size: 12px; padding: 10px 4px; }
      input { font-size: 16px; padding: 13px 14px; }
      .row-actions { grid-template-columns: 1fr; }
      .product-code { font-size: 21px; }
      .product-name { font-size: 19px; }
      .price { font-size: 36px; }
      .product-item { grid-template-columns: 82px 1fr auto; gap: 7px; padding: 12px 10px; }
      .item-code, .item-name, .item-price { font-size: 12px; }
    }
  </style>
</head>

  <script>
    'use strict';

    let products = [];
    let productsByCode = new Map();
    let currentTab = 'search';
    let html5QrCode = null;
    let html5QrCodeReady = false;
    let nativeStream = null;
    let nativeScanTimer = null;
    let nativeDetector = null;
    let lastScannedCode = '';
    let lastScannedAt = 0;

    const els = {
      totalCount: document.getElementById('totalCount'),
      searchInput: document.getElementById('searchInput'),
      searchBtn: document.getElementById('searchBtn'),
      clearBtn: document.getElementById('clearBtn'),
      goScannerBtn: document.getElementById('goScannerBtn'),
      searchResult: document.getElementById('searchResult'),
      scanResult: document.getElementById('scanResult'),
      reader: document.getElementById('reader'),
      video: document.getElementById('video'),
      cameraPlaceholder: document.getElementById('cameraPlaceholder'),
      scanLine: document.getElementById('scanLine'),
      startScanBtn: document.getElementById('startScanBtn'),
      stopScanBtn: document.getElementById('stopScanBtn'),
      manualScanInput: document.getElementById('manualScanInput'),
      manualScanBtn: document.getElementById('manualScanBtn'),
      filterInput: document.getElementById('filterInput'),
      productsList: document.getElementById('productsList'),
      listFooter: document.getElementById('listFooter'),
      toastWrap: document.getElementById('toastWrap')
    };

    function normalizeCode(value) {
      return String(value || '').trim().toUpperCase();
    }

    function safeText(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatPrice(value) {
      const n = Number(value || 0);
      if (!Number.isFinite(n)) return '0';
      return n % 1 === 0 ? String(n.toFixed(0)) : String(n.toFixed(2));
    }

    function initProducts() {
      if (!window.PRODUCTS_DATA || !Array.isArray(window.PRODUCTS_DATA)) {
        document.querySelector('main').innerHTML = '<div class="not-found">خطأ: لم يتم تحميل بيانات المنتجات داخل الملف</div>';
        return;
      }

      products = window.PRODUCTS_DATA
        .map(p => ({
          code: normalizeCode(p.code),
          name: String(p.name || 'بدون اسم').trim() || 'بدون اسم',
          price: Number(p.price || 0)
        }))
        .filter(p => p.code);

      productsByCode = new Map();
      for (const p of products) {
        if (!productsByCode.has(p.code)) productsByCode.set(p.code, p);
      }

      els.totalCount.textContent = products.length.toLocaleString('ar-LY');
      renderProductsList();
    }

    function findProduct(query) {
      const code = normalizeCode(query);
      if (!code) return null;
      return productsByCode.get(code) || null;
    }

    function productCard(product) {
      return `
        <div class="product-card">
          <div class="product-head">
            <div class="label" style="color:rgba(255,255,255,.75)">كود المنتج</div>
            <div class="product-code">${safeText(product.code)}</div>
          </div>
          <div class="product-body">
            <div class="label">اسم المنتج</div>
            <div class="product-name">${safeText(product.name)}</div>
            <div class="price-box">
              <div class="label" style="color:var(--success)">السعر</div>
              <div class="price">${formatPrice(product.price)}</div>
              <div class="currency">دينار ليبي</div>
            </div>
          </div>
        </div>`;
    }

    function notFoundCard(code) {
      return `
        <div class="not-found">
          <div style="font-size:36px;line-height:1;margin-bottom:8px">!</div>
          لم يتم العثور على المنتج<br>
          <span style="font-family:Consolas,monospace;direction:ltr;display:inline-block;margin-top:7px">${safeText(code)}</span>
        </div>`;
    }

    function showProductByCode(code, target) {
      const normalized = normalizeCode(code);
      if (!normalized) {
        showToast('اكتب كود المنتج أولاً', 'error');
        return;
      }
      const product = findProduct(normalized);
      const resultEl = target === 'scan' ? els.scanResult : els.searchResult;
      if (product) {
        resultEl.innerHTML = productCard(product);
        showToast('تم العثور على المنتج', 'success');
        beep();
      } else {
        resultEl.innerHTML = notFoundCard(normalized);
        showToast('المنتج غير موجود', 'error');
      }
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
      document.querySelectorAll('.panel').forEach(panel => panel.classList.toggle('active', panel.id === tab));
      if (tab !== 'scan') stopScanner();
      if (tab === 'all') renderProductsList();
      setTimeout(() => {
        if (tab === 'search') els.searchInput.focus();
        if (tab === 'all') els.filterInput.focus();
      }, 80);
    }

    function renderProductsList() {
      const q = String(els.filterInput.value || '').trim().toLowerCase();
      let filtered = products;
      if (q) {
        filtered = products.filter(p => p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
      }

      const max = 600;
      const visible = filtered.slice(0, max);
      els.productsList.innerHTML = visible.map(p => `
        <div class="product-item" data-code="${safeText(p.code)}">
          <div class="item-code">${safeText(p.code)}</div>
          <div class="item-name">${safeText(p.name)}</div>
          <div class="item-price">${formatPrice(p.price)} د.ل</div>
        </div>
      `).join('') || '<div class="footer-note">لا توجد نتائج</div>';

      els.listFooter.textContent = `عرض ${Math.min(filtered.length, max).toLocaleString('ar-LY')} من ${filtered.length.toLocaleString('ar-LY')} منتج`;
    }

    function showToast(message, type = 'info') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = message;
      els.toastWrap.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    function beep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = .08;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 110);
      } catch (_) {}
    }

    function setScanningUi(active, message) {
      els.startScanBtn.style.display = active ? 'none' : 'flex';
      els.stopScanBtn.style.display = active ? 'flex' : 'none';
      els.scanLine.style.display = active ? 'block' : 'none';
      els.cameraPlaceholder.style.display = active ? 'none' : 'block';
      if (message) els.cameraPlaceholder.innerHTML = message;
    }

    function handleDecodedCode(decodedText) {
      const code = normalizeCode(decodedText);
      const now = Date.now();
      if (!code) return;
      if (code === lastScannedCode && now - lastScannedAt < 1800) return;
      lastScannedCode = code;
      lastScannedAt = now;
      els.manualScanInput.value = code;
      showProductByCode(code, 'scan');
    }

    function loadHtml5QrcodeLibrary() {
      return new Promise((resolve, reject) => {
        if (window.Html5Qrcode && window.Html5QrcodeSupportedFormats) {
          html5QrCodeReady = true;
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        script.async = true;
        script.onload = () => { html5QrCodeReady = true; resolve(); };
        script.onerror = () => reject(new Error('Could not load html5-qrcode'));
        document.head.appendChild(script);
      });
    }

    async function startScanner() {
      setScanningUi(true);

      // First try native BarcodeDetector. This works offline in many Chromium Android browsers.
      if ('BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          nativeDetector = new BarcodeDetector({
            formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'code_93', 'upc_a', 'upc_e', 'qr_code']
          });
          nativeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
          els.video.srcObject = nativeStream;
          els.video.style.display = 'block';
          els.reader.style.display = 'none';
          await els.video.play();
          nativeScanLoop();
          showToast('الكاميرا تعمل الآن', 'success');
          return;
        } catch (err) {
          stopNativeScanner();
          console.warn('Native BarcodeDetector failed, trying html5-qrcode:', err);
        }
      }

      // Fallback to html5-qrcode from CDN.
      try {
        await loadHtml5QrcodeLibrary();
        els.reader.style.display = 'block';
        els.video.style.display = 'none';
        html5QrCode = html5QrCode || new Html5Qrcode('reader');
        const formats = [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.QR_CODE
        ];
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 280, height: 140 }, formatsToSupport: formats },
          text => handleDecodedCode(text),
          () => {}
        );
        showToast('الكاميرا تعمل الآن', 'success');
      } catch (err) {
        console.error(err);
        setScanningUi(false, '<div style="font-size:34px">⚠</div><div>تعذر تشغيل الكاميرا</div><div class="small-muted" style="color:rgba(255,255,255,.72)">تأكد من السماح بالكاميرا وفتح التطبيق عبر HTTPS. يمكنك استخدام الإدخال اليدوي.</div>');
        showToast('تعذر تشغيل الكاميرا', 'error');
      }
    }

    async function nativeScanLoop() {
      if (!nativeDetector || !els.video.srcObject) return;
      try {
        if (els.video.readyState >= 2) {
          const barcodes = await nativeDetector.detect(els.video);
          if (barcodes && barcodes.length) handleDecodedCode(barcodes[0].rawValue);
        }
      } catch (_) {}
      nativeScanTimer = setTimeout(nativeScanLoop, 180);
    }

    function stopNativeScanner() {
      if (nativeScanTimer) clearTimeout(nativeScanTimer);
      nativeScanTimer = null;
      if (nativeStream) {
        nativeStream.getTracks().forEach(track => track.stop());
        nativeStream = null;
      }
      els.video.pause();
      els.video.srcObject = null;
      els.video.style.display = 'none';
      nativeDetector = null;
    }

    async function stopScanner() {
      stopNativeScanner();
      if (html5QrCode) {
        try {
          if (html5QrCode.isScanning) await html5QrCode.stop();
        } catch (_) {}
      }
      els.reader.style.display = 'none';
      setScanningUi(false);
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    els.searchBtn.addEventListener('click', () => showProductByCode(els.searchInput.value, 'search'));
    els.searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') showProductByCode(els.searchInput.value, 'search');
    });
    els.clearBtn.addEventListener('click', () => {
      els.searchInput.value = '';
      els.searchResult.innerHTML = '';
      els.searchInput.focus();
    });
    els.goScannerBtn.addEventListener('click', () => {
      switchTab('scan');
      setTimeout(startScanner, 250);
    });

    els.startScanBtn.addEventListener('click', startScanner);
    els.stopScanBtn.addEventListener('click', stopScanner);
    els.manualScanBtn.addEventListener('click', () => showProductByCode(els.manualScanInput.value, 'scan'));
    els.manualScanInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') showProductByCode(els.manualScanInput.value, 'scan');
    });

    els.filterInput.addEventListener('input', renderProductsList);
    els.productsList.addEventListener('click', e => {
      const item = e.target.closest('.product-item');
      if (!item) return;
      const code = item.dataset.code;
      switchTab('search');
      els.searchInput.value = code;
      showProductByCode(code, 'search');
    });

    window.addEventListener('pagehide', stopScanner);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopScanner();
    });

    initProducts();
  </script>
