body.auth-locked #login{display:flex!important}

async function saveCart(){if(!appUser)return toast('سجل الدخول'); if(!cart.length)return toast('السلة فارغة'); try{const row=await rpc('save_pricechecker_cart',{p_cart:payload(),p_items:items(currentCloud),p_cart_id:currentCloud||null}); currentCloud=row.id; save('cloud',currentCloud); toast('تم الحفظ'); loadSaved()}catch(e){console.error(e);toast('فشل الحفظ: '+String(e.message||e).slice(0,140))}} async function loadSaved(){if(!appUser)return; try{saved=await sb('carts?select=*&user_id=eq.'+appUser.id+'&order=updated_at.desc&limit=80'); renderSaved()}catch(e){console.warn(e);renderSaved()}} function renderSaved(){$('savedList').innerHTML=(saved||[]).map(s=>`<div class="savedItem"><b>${esc(s.customer_name||'سلة')}</b><div class="margin">${new Date(s.updated_at||s.created_at).toLocaleString('ar-LY')} — ${price(s.total)} د.ل</div><div class="actions"><button class="btn" data-restore="${s.id}">فتح</button></div></div>`).join('')||'<div class="cartItem">لا توجد سلات</div>'}
async function restore(id){try{const s=saved.find(x=>x.id===id); const its=await sb('cart_items?cart_id=eq.'+id+'&select=*'); cart=its.map(i=>({code:i.product_code,qty:Number(i.quantity),price:Number(i.unit_price)})); currentCloud=id; discount=Number(s.discount_percent)||0; customer={name:s.customer_name||'',phone:s.customer_phone||'',notes:s.notes||''}; save('cart',cart);save('cloud',currentCloud);save('discount',discount);save('customer',customer);fillCustomer();renderCart();showPage('cartPage')}catch(e){toast('فشل فتح السلة')}}
function addHistory(code){history=history.filter(x=>x!==code); history.unshift(code); history=history.slice(0,50); save('history',history); renderHistory()} function renderHistory(){$('historyList').innerHTML=history.map(c=>{const p=byCode.get(c);return p?`<div class="histItem" data-open="${p.code}"><div class="cartCode">${p.code}</div><div class="cartName">${esc(p.name)}</div></div>`:''}).join('')||'<div class="cartItem">لا يوجد سجل</div>'}
function cartText(){const t=totals(); return ['قائمة العميل',customer.name&&'العميل: '+customer.name,customer.phone&&'الهاتف: '+customer.phone,...cart.map((x,i)=>{const p=byCode.get(x.code);return `${i+1}. ${p.code} - ${p.name} - ${x.qty} × ${price(x.price)} = ${price(x.price*x.qty)} د.ل`}),discount&&'الخصم: '+discount+'%','الإجمالي: '+price(t.total)+' د.ل'].filter(Boolean).join('\n')} function printCart(){if(!cart.length)return toast('السلة فارغة'); const t=totals(); const rows=cart.map((x,i)=>{const p=byCode.get(x.code); if(!p)return ''; return `<tr><td>${i+1}</td><td class="codeCell">${esc(p.code)}</td><td>${esc(p.name)}</td><td>${x.qty}</td><td>${price(x.price)}</td><td>${price(x.price*x.qty)}</td></tr>`}).join(''); const inv='INV-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(Date.now()).slice(-4); const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>عرض سعر</title><style>*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;margin:0;background:#f3f6fb;color:#172033;padding:24px}.invoice{max-width:900px;margin:auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.12)}.head{display:flex;justify-content:space-between;align-items:center;gap:18px;background:linear-gradient(135deg,#102b9f,#5a7cff);color:#fff;padding:22px}.brand{display:flex;align-items:center;gap:14px}.logo{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:16px;padding:5px}.brand h1{margin:0;font-size:25px}.brand p{margin:4px 0 0;opacity:.85}.inv{text-align:left;direction:ltr}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px;background:#fbfdff;border-bottom:1px solid #e5eaf5}.box{border:1px solid #e3e9f5;border-radius:14px;padding:12px}.label{color:#667085;font-size:13px;font-weight:bold;margin-bottom:6px}.val{font-size:15px;font-weight:bold;line-height:1.7}table{width:100%;border-collapse:collapse}th{background:#172033;color:white;padding:11px;font-size:13px}td{padding:10px;border-bottom:1px solid #edf1f7;text-align:center}td:nth-child(3){text-align:right}.codeCell{direction:ltr;color:#102b9f;font-weight:bold}.totals{margin:18px 20px 20px auto;width:330px;border:1px solid #e3e9f5;border-radius:14px;overflow:hidden}.totRow{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid #edf1f7;font-weight:bold}.totRow.final{background:#0f172a;color:white;font-size:19px}.discount{color:#b7791f}.foot{text-align:center;color:#667085;border-top:1px solid #edf1f7;padding:15px;font-size:13px}@media print{body{background:white;padding:0}.invoice{box-shadow:none;border-radius:0}}</style></head><body><div class="invoice"><div class="head"><div class="brand"><img class="logo" src="${LOGO_DATA}"><div><h1>مجموعة بن عمر</h1><p>للمواد الصحية</p></div></div><div class="inv"><h2>عرض سعر</h2><div>${inv}</div><div>${new Date().toLocaleDateString('ar-LY')}</div></div></div><div class="info"><div class="box"><div class="label">بيانات العميل</div><div class="val">${esc(customer.name||'عميل نقدي')}<br>${esc(customer.phone||'')}</div></div><div class="box"><div class="label">ملاحظات</div><div class="val">${esc(customer.notes||'—')}</div></div></div><table><thead><tr><th>#</th><th>الكود</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${rows}</tbody></table><div class="totals"><div class="totRow"><span>الإجمالي قبل الخصم</span><span>${price(t.sub)} د.ل</span></div><div class="totRow"><span>الخصم ${t.d}%</span><span class="discount">${price(t.da)} د.ل</span></div><div class="totRow final"><span>الإجمالي النهائي</span><span>${price(t.total)} د.ل</span></div></div><div class="foot">شكراً لاختياركم مجموعة بن عمر</div></div><script>window.onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`; const w=window.open('','_blank'); w.document.write(html); w.document.close();} function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===id)); if(id==='cartPage')renderCart(); if(id==='savedPage')loadSaved(); if(id==='historyPage')renderHistory()}
document.addEventListener('input',e=>{if(e.target.classList.contains('sInput'))schedule(); if(e.target.id==='discount'){discount=Number(e.target.value)||0;save('discount',discount);renderCart()} if(e.target.matches('#customerName,#customerPhone,#cartNotes'))saveCustomer()}); document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]'); if(nav){showPage(nav.dataset.page);return} const as=e.target.closest('#addSearch'); if(as){const d=document.createElement('div');d.className='extraSearch';d.innerHTML='<button class="addSearch removeS">−</button><input class="searchInput sInput" placeholder="بحث إضافي...">';$('searchInputs').appendChild(d);d.querySelector('input').focus();return} if(e.target.closest('.removeS')){e.target.closest('.extraSearch').remove();doSearch();return} const cq=e.target.closest('[data-cardq]'); if(cq){const q=$('cardQty');q.value=Math.max(1,(parseInt(q.value)||1)+parseInt(cq.dataset.cardq));return} const add=e.target.closest('[data-add]'); if(add){addCart(add.dataset.add,add.dataset.card?$('cardQty')?.value:1);return} const open=e.target.closest('[data-open]'); if(open){const p=byCode.get(open.dataset.open);renderSelected(p);addHistory(p.code);return} const qty=e.target.closest('[data-qty]'); if(qty){const it=cart.find(x=>x.code===qty.dataset.qty); if(it){it.qty+=parseInt(qty.dataset.d); if(it.qty<=0)cart=cart.filter(x=>x.code!==qty.dataset.qty); save('cart',cart);renderCart()}return} const restoreBtn=e.target.closest('[data-restore]'); if(restoreBtn){restore(restoreBtn.dataset.restore);return}}); document.addEventListener('change',e=>{const pr=e.target.closest('[data-price]'); if(pr){const it=cart.find(x=>x.code===pr.dataset.price); if(it){it.price=Number(pr.value)||0;save('cart',cart);renderCart()}}});
$('loginBtn').onclick=()=>login(false);$('createBtn').onclick=()=>login(true);$('logout').onclick=()=>{logoutApp()};$('saveCart').onclick=saveCart;$('refreshSaved').onclick=loadSaved;$('clearCart').onclick=()=>{cart=[];currentCloud=null;save('cart',cart);save('cloud',null);renderCart()};$('copyCart').onclick=()=>navigator.clipboard?.writeText(cartText()).then(()=>toast('تم النسخ'));$('printCart').onclick=printCart;$('whatsapp').onclick=()=>location.href='https://wa.me/?text='+encodeURIComponent(cartText());$('clearHistory').onclick=()=>{history=[];save('history',history);renderHistory()};
